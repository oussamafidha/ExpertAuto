security:
    role_hierarchy:
        ROLE_ADMIN: [ROLE_MECHANIC, ROLE_STOREKEEPER, ROLE_CLIENT, ROLE_USER]
        ROLE_MECHANIC: [ROLE_USER]
        ROLE_STOREKEEPER: [ROLE_USER]
        ROLE_CLIENT: [ROLE_USER]
    password_hashers:
        App\Entity\User: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
                use_referer: true
                always_use_default_target_path: false
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
            logout:
                path: app_logout
                target: app_login
    access_control:
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/initialiser-admin, roles: PUBLIC_ACCESS }
        - { path: ^/dashboard/actualiser$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/utilisateurs, roles: ROLE_ADMIN }
        - { path: ^/voitures, roles: [ROLE_ADMIN, ROLE_MECHANIC, ROLE_STOREKEEPER, ROLE_CLIENT] }
        - { path: ^/reparations, roles: [ROLE_ADMIN, ROLE_MECHANIC, ROLE_STOREKEEPER, ROLE_CLIENT] }
        - { path: ^/pieces, roles: [ROLE_ADMIN, ROLE_STOREKEEPER] }
        - { path: ^/factures, roles: ROLE_ADMIN }
        - { path: ^/rendez-vous, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }
